<style>
  .map { display: flex; gap: 4px; margin-top: 6px; align-items: stretch; }
  .seg { flex: 1 1 0; min-width: 0; border-radius: 10px; padding: 10px 6px; text-align: center; cursor: pointer; border: 2px solid transparent;
    font-size: 12.5px; font-weight: 800; color: var(--bg); line-height: 1.35; transition: transform 0.1s; }
  .seg small { display: block; font-weight: 600; font-size: 11px; opacity: 0.8; font-family: var(--mono); }
  .seg:hover { transform: translateY(-3px); }
  .seg.sel { border-color: #fff; box-shadow: 0 0 0 2px #fff; }
  .seg.data { flex: 3 1 0; }
  .scalebar { display: flex; height: 22px; border-radius: 8px; overflow: hidden; border: 2px solid var(--line); margin-top: 6px; }
  .scalebar div { height: 100%; }
  .detail { margin-top: 12px; min-height: 150px; }
  .detail h3 { margin: 0 0 6px; font-size: 16px; }
  .hexrow { font-family: var(--mono); font-size: 15px; font-weight: 800; letter-spacing: 0.06em; background: var(--bg); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 10px; display: inline-block; margin: 4px 0; color: var(--gold); word-break: break-all; }
  table.kv { border-collapse: collapse; width: 100%; font-size: 12.5px; margin-top: 6px; }
  table.kv td { padding: 3px 10px 3px 0; border-bottom: 1px solid var(--panel2); font-family: var(--mono); vertical-align: top; word-break: break-all; }
  table.kv td:first-child { color: var(--sky); white-space: nowrap; }
  .ascii { display: grid; grid-template-columns: repeat(13, minmax(0, 1fr)); gap: 4px; margin-top: 8px; }
  .ascii div { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; text-align: center; font-family: var(--mono); font-size: 12px; padding: 3px 0; line-height: 1.3; }
  .ascii div b { display: block; color: var(--gold); font-size: 14px; }
</style>
<div class="wrap">
  <h2><span class="tag">第 5 章</span>GGUF 藏寶箱地圖</h2>
  <p class="sub">這是<b>你剛剛親手轉出來的檔案</b> <span class="mono gold" id="fname"></span> 的內部構造。點每一格看看裡面裝什麼。</p>
  <div class="map" id="map"></div>
  <div class="muted" style="font-size:12.5px;margin-top:10px">▼ 依照實際大小畫出來的話……（幾乎整個檔案都是權重）</div>
  <div class="scalebar" id="scalebar"></div>
  <div class="panel detail" id="detail"></div>
  <div class="quest">🎯 <b>任務 5-4：</b>檔案最前面 4 個 byte 是 <span class="mono gold" id="magic"></span>。
    用下面的 ASCII 對照表，把它們翻譯成 4 個英文字母，填進下一格程式碼。
    <div class="ascii" id="ascii"></div>
  </div>
</div>
<script>
  (function () {
    const D = window.DATA;
    $('#fname').textContent = D.file;
    $('#magic').textContent = D.magic_hex;
    const metaBytes = D.data_offset;
    const SEGS = [
      { id: 'magic', n: '魔法數字', s: '4 bytes', c: '#ffd166' },
      { id: 'ver', n: '版本', s: '4 bytes', c: '#ff9f5a' },
      { id: 'nt', n: '張量數量', s: '8 bytes', c: '#ff7aa8' },
      { id: 'nkv', n: '設定數量', s: '8 bytes', c: '#b794ff' },
      { id: 'kv', n: '設定值 Metadata', s: `${D.n_kv} 筆`, c: '#74b9ff' },
      { id: 'ti', n: '張量目錄', s: `${D.n_tensors} 筆`, c: '#5ee6c0' },
      { id: 'data', n: '張量資料（權重本體）', s: fmtBytes(D.size - D.data_offset), c: '#f1f3ff', data: true },
    ];
    const kvRows = (D.kvs || []).map((k) => `<tr><td>${k.key}</td><td class="muted">${k.type}</td><td>${k.value}</td></tr>`).join('');
    const tiRows = (D.tensors || []).map((t) => `<tr><td>${t.name}</td><td>[${t.shape}]</td><td class="gold">${t.type}</td><td class="muted">${fmtBytes(t.nbytes)}</td></tr>`).join('');
    const DETAIL = {
      magic: `<h3>🪄 魔法數字（Magic）</h3>這種格式的每一個檔案，頭 4 個 byte 都一模一樣。程式一打開檔案就先看這 4 個 byte，確認「沒拿錯檔案」。
        <br><span class="hexrow">${D.magic_hex}</span><br>把這 4 個 byte 當成 ASCII 字元唸出來，你會看到這個格式的名字 —— 這就是任務 5-4 的答案。`,
      ver: `<h3>🔢 版本號</h3>一個 32-bit 的整數（little-endian：低位的 byte 寫在前面）。
        <br><span class="hexrow">${D.version_hex}</span> → 版本 <b class="gold">${D.version}</b>
        <br><span class="muted">格式以後如果改版，讀檔程式看這個數字就知道該怎麼讀。</span>`,
      nt: `<h3>🧮 張量數量</h3>一個 64-bit 整數，說明檔案裡總共有幾個張量（tensor，也就是一整塊權重）。
        <br><span class="hexrow">${D.nt_hex}</span> → <b class="gold">${D.n_tensors}</b> 個張量`,
      nkv: `<h3>🏷️ 設定數量</h3>一個 64-bit 整數，說明後面跟著幾筆「鍵 = 值」的設定。
        <br><span class="hexrow">${D.nkv_hex}</span> → <b class="gold">${D.n_kv}</b> 筆設定`,
      kv: `<h3>📋 設定值（Metadata）</h3>模型的「身分證」：架構、層數、詞彙表、聊天樣板……全部塞在同一個檔案裡，
        所以只要一個 .gguf 檔就能跑模型，不需要另外帶一堆 json。以下是你的檔案裡的前幾筆：
        <table class="kv">${kvRows}</table>
        <div class="muted" style="font-size:12.5px;margin-top:6px">（這一區 + 張量目錄總共 ${fmtBytes(metaBytes)}，大部分是詞彙表）</div>`,
      ti: `<h3>🗂️ 張量目錄（Tensor Info）</h3>每個張量一筆：名字、形狀、<b class="gold">型別</b>、在資料區的位置。
        「型別」就是量化的關鍵 —— 現在是 F16，等一下我們要把它們變成 Q4_0！
        <table class="kv">${tiRows}</table><div class="muted" style="font-size:12.5px;margin-top:6px">……共 ${D.n_tensors} 筆</div>`,
      data: `<h3>💎 張量資料</h3>真正的權重，一個接一個排好。每個張量的起點都對齊到 <b class="gold">${D.alignment}</b> bytes 的倍數
        （中間補 0），這樣程式可以用 mmap 直接把檔案「映射」進記憶體，不用整個讀進來。
        <br>資料區從第 <span class="mono gold">${D.data_offset.toLocaleString('en-US')}</span> 個 byte 開始，
        佔了整個檔案的 <b class="gold">${((1 - D.data_offset / D.size) * 100).toFixed(1)}%</b>。<br>量化要瘦身的就是這一大塊。`,
    };
    let sel = 'magic';
    function draw() {
      $('#map').innerHTML = SEGS.map((s) =>
        `<div class="seg${s.data ? ' data' : ''}${s.id === sel ? ' sel' : ''}" data-id="${s.id}" style="background:${s.c}" tabindex="0" role="button">${s.n}<small>${s.s}</small></div>`).join('');
      $('#detail').innerHTML = DETAIL[sel];
      fit();
    }
    const pct = Math.max(0.6, (metaBytes / D.size) * 100);
    $('#scalebar').innerHTML = `<div style="width:${pct}%;background:#74b9ff" title="檔頭 + 設定 + 目錄"></div><div style="flex:1;background:#f1f3ff" title="張量資料"></div>`;
    $('#map').addEventListener('click', (e) => { const s = e.target.closest('.seg'); if (s) { sel = s.dataset.id; draw(); } });
    $('#map').addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { const s = e.target.closest('.seg'); if (s) { e.preventDefault(); sel = s.dataset.id; draw(); } } });
    $('#ascii').innerHTML = Array.from({ length: 26 }, (_, i) => `<div><b>${String.fromCharCode(65 + i)}</b>${hex2(65 + i)}</div>`).join('');
    draw();
  })();
</script>
